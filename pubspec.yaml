name: ocr_expense_tracker
description: "OCR Expense Tracker & Receipt Parser in Flutter & Dart"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Database & Storage
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3

  # Camera & Image
  camera: ^0.11.0
  image_picker: ^1.1.2
  image_cropper: ^8.0.0

  # On-Device ML Kit Text Recognition
  google_mlkit_text_recognition: ^0.13.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
